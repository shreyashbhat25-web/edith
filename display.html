<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>EDITH — Display</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1A2B;
    --bg-raised:#132437;
    --amber:#E8A33D;
    --teal:#5C8A89;
    --cream:#F1EAD9;
    --dim:#7C8CA0;
    --line:#22384F;
  }
  *{box-sizing:border-box;}
  html{ height:100%; }
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:radial-gradient(circle at 50% 0%, #14263c, var(--bg) 70%);
    color:var(--cream); font-family:'IBM Plex Sans', sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }

  /* Gate screen */
  #gate{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; width:100%; }
  #gate .dial{ width:90px; height:90px; border-radius:50%; border:3px solid var(--line); position:relative; }
  #gate .dial::after{ content:''; position:absolute; top:8px; left:50%; width:4px; height:26px; background:var(--amber); transform:translateX(-50%); border-radius:3px; }
  #gate h1{ font-family:'IBM Plex Mono', monospace; letter-spacing:6px; font-size:28px; margin:0; }
  #codeInput{
    font-family:'IBM Plex Mono', monospace; font-size:32px; letter-spacing:12px; text-align:center;
    background:var(--bg-raised); border:1px solid var(--line); color:var(--amber);
    padding:16px 20px; border-radius:10px; width:280px;
  }
  #codeInput:focus{ outline:none; border-color:var(--amber); }
  #connectBtn{ background:var(--amber); color:var(--bg); border:none; padding:14px 34px; border-radius:8px; font-size:16px; font-weight:600; }
  #gate .hint{ color:var(--dim); font-family:'IBM Plex Mono', monospace; font-size:13px; }

  /* Display screen */
  #display{ display:none; flex-direction:column; width:100%; max-width:1100px; height:100vh; height:100dvh; padding:40px; }
  #display.active{ display:flex; }
  .dhead{ display:flex; align-items:center; gap:20px; margin-bottom:28px; }
  .dhead .dial{ width:48px; height:48px; border-radius:50%; border:3px solid var(--line); position:relative; transition:border-color .3s; }
  .dhead .dial.thinking{ border-color:var(--amber); }
  .dhead .dial::after{ content:''; position:absolute; top:4px; left:50%; width:3px; height:14px; background:var(--amber); transform-origin:50% 20px; transform:translateX(-50%) rotate(0deg); border-radius:2px; }
  .dhead .dial.thinking::after{ animation: sweep 1.1s linear infinite; }
  @keyframes sweep{ to{ transform:translateX(-50%) rotate(360deg); } }
  .dhead b{ font-family:'IBM Plex Mono', monospace; font-size:24px; letter-spacing:4px; }
  .dhead span{ font-family:'IBM Plex Mono', monospace; font-size:13px; color:var(--dim); margin-left:auto; }
  #feed{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:22px; padding-bottom:20px; }
  .drow .meta{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--dim); letter-spacing:2px; margin-bottom:6px; }
  .drow.user .meta{ color:var(--teal); }
  .drow.assistant .meta{ color:var(--amber); }
  .drow .bubble{ font-size:22px; line-height:1.55; white-space:pre-wrap; max-width:90%; }
  .drow.user .bubble{ color:var(--cream); opacity:.85; }
  .drow.assistant .bubble{ color:var(--cream); border-left:3px solid var(--amber); padding-left:18px; }
</style>
</head>
<body>

<div id="gate">
  <div class="dial"></div>
  <h1>EDITH DISPLAY</h1>
  <input id="codeInput" maxlength="8" placeholder="0000" inputmode="numeric">
  <button id="connectBtn">CONNECT</button>
  <div class="hint">Enter the pairing code shown in your EDITH phone app settings</div>
</div>

<div id="display">
  <div class="dhead">
    <div class="dial" id="ddial"></div>
    <b>EDITH</b>
    <span id="dstatus">room —</span>
  </div>
  <div id="feed"></div>
</div>

<script>
let relayUrl = '';
let code = '';
let pollTimer = null;

// Try to pick up relay URL from ?relay= query param, else ask
const params = new URLSearchParams(location.search);
if(params.get('relay')) relayUrl = params.get('relay').replace(/\/$/, '');

document.getElementById('connectBtn').onclick = connect;
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') connect();
});

function connect(){
  code = document.getElementById('codeInput').value.trim();
  if(!code) return;
  if(!relayUrl){
    relayUrl = prompt('Paste your EDITH relay URL (e.g. https://edith.yourname.workers.dev)');
    if(!relayUrl) return;
    relayUrl = relayUrl.trim().replace(/\/$/, '');
  }
  document.getElementById('gate').style.display = 'none';
  document.getElementById('display').classList.add('active');
  document.getElementById('dstatus').textContent = 'room ' + code;
  poll();
  pollTimer = setInterval(poll, 1500);
}

async function poll(){
  try{
    const res = await fetch(`${relayUrl}/poll?code=${encodeURIComponent(code)}`);
    const data = await res.json();
    render(data.messages || [], data.status || 'idle');
  }catch(e){ /* silent — retry next tick */ }
}

let lastCount = -1;
function render(messages, status){
  const dial = document.getElementById('ddial');
  dial.classList.toggle('thinking', status === 'thinking');

  if(messages.length === lastCount) return; // no change, skip re-render
  lastCount = messages.length;

  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'drow ' + m.role;
    const label = m.role === 'user' ? 'YOU' : 'EDITH';
    row.innerHTML = `<div class="meta">${label}</div><div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = m.content;
    feed.appendChild(row);
  });
  feed.scrollTop = feed.scrollHeight;
}
</script>
</body>
</html>
