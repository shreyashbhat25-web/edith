<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>EDITH -- Display</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050B14; --panel:#081420; --cyan:#3FE1FF; --cyan-dim:#0F5C6E;
    --line:#123444; --text:#D8F6FF; --dim:#5C8899;
  }
  *{box-sizing:border-box;}
  html{ height:100%; }
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(circle at 50% 0%, #0B2230 0%, var(--bg) 60%),
      repeating-linear-gradient(0deg, rgba(63,225,255,0.02) 0px, rgba(63,225,255,0.02) 1px, transparent 1px, transparent 3px);
    color:var(--text); font-family:'IBM Plex Mono', monospace;
    display:flex; flex-direction:column; align-items:center;
  }

  #gate{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; width:100%; }
  #gate .ring{ width:110px; height:110px; border-radius:50%; border:2px solid var(--cyan-dim); position:relative; box-shadow:0 0 30px rgba(63,225,255,.2) inset; }
  #gate .ring::before{ content:''; position:absolute; inset:-3px; border-radius:50%; border:3px solid transparent; border-top-color:var(--cyan); animation:spin 3s linear infinite; }
  #gate .ring::after{ content:''; position:absolute; inset:34px; border-radius:50%; background:var(--cyan); opacity:.4; box-shadow:0 0 24px var(--cyan); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #gate h1{ font-family:'Orbitron', sans-serif; letter-spacing:10px; font-size:26px; margin:0; color:var(--cyan); text-shadow:0 0 20px rgba(63,225,255,.6); }
  #codeInput{
    font-family:'IBM Plex Mono', monospace; font-size:34px; letter-spacing:14px; text-align:center;
    background:var(--panel); border:1px solid var(--cyan-dim); color:var(--cyan);
    padding:16px 20px; width:300px; text-shadow:0 0 10px rgba(63,225,255,.5);
  }
  #codeInput:focus{ outline:none; border-color:var(--cyan); }
  #connectBtn{ background:var(--cyan); color:var(--bg); border:none; padding:14px 40px; font-size:15px; font-weight:700; letter-spacing:2px; clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px); }
  #gate .hint{ color:var(--dim); font-size:12px; letter-spacing:1px; }
  #gate .err{ color:#FF5C5C; font-size:12px; letter-spacing:1px; display:none; }

  #display{ display:none; flex-direction:column; width:100%; max-width:1200px; height:100vh; height:100dvh; padding:44px; }
  #display.active{ display:flex; }
  .dhead{ display:flex; align-items:center; gap:20px; margin-bottom:30px; border-bottom:1px solid var(--line); padding-bottom:18px; }
  .dhead .ring{ width:52px; height:52px; border-radius:50%; border:2px solid var(--cyan-dim); position:relative; box-shadow:0 0 14px rgba(63,225,255,.2) inset; }
  .dhead .ring::before{ content:''; position:absolute; inset:-2px; border-radius:50%; border:2px solid transparent; border-top-color:var(--cyan); animation:spin 2.4s linear infinite; }
  .dhead .ring.thinking::before{ animation-duration:.6s; }
  .dhead .ring::after{ content:''; position:absolute; inset:16px; border-radius:50%; background:var(--cyan); opacity:.4; }
  .dhead .ring.thinking::after{ opacity:1; box-shadow:0 0 16px var(--cyan); }
  .dhead b{ font-family:'Orbitron', sans-serif; font-size:26px; letter-spacing:6px; color:var(--cyan); text-shadow:0 0 16px rgba(63,225,255,.5); }
  .dhead span{ font-size:13px; color:var(--dim); margin-left:auto; letter-spacing:1px; }
  #feed{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:24px; padding-bottom:20px; }
  .drow .meta{ font-size:12px; color:var(--dim); letter-spacing:3px; margin-bottom:7px; }
  .drow.user .meta{ color:var(--dim); }
  .drow.assistant .meta{ color:var(--cyan); }
  .drow .bubble{ font-size:22px; line-height:1.6; white-space:pre-wrap; max-width:92%; }
  .drow.user .bubble{ color:var(--text); opacity:.75; }
  .drow.assistant .bubble{ color:var(--text); border-left:3px solid var(--cyan); padding-left:20px; }
  .drow .bubble pre{
    background:#020609; border:1px solid var(--cyan-dim); padding:16px 18px;
    overflow-x:auto; margin:12px 0; font-size:17px; color:#8FF7FF; border-radius:2px;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="ring"></div>
  <h1>EDITH DISPLAY</h1>
  <input id="codeInput" maxlength="8" placeholder="0000" inputmode="numeric">
  <button id="connectBtn">CONNECT</button>
  <div class="hint">ENTER THE PAIRING CODE FROM YOUR EDITH PHONE APP</div>
  <div class="err" id="err"></div>
</div>

<div id="display">
  <div class="dhead">
    <div class="ring" id="ddial"></div>
    <b>EDITH</b>
    <span id="dstatus">room --</span>
  </div>
  <div id="feed"></div>
</div>

<script>
let relayUrl = '';
let code = '';
let pollTimer = null;

const params = new URLSearchParams(location.search);
if(params.get('relay')) relayUrl = params.get('relay').replace(/\/$/, '');

document.getElementById('connectBtn').onclick = connect;
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter') connect();
});

async function connect(){
  code = document.getElementById('codeInput').value.trim();
  const errEl = document.getElementById('err');
  errEl.style.display = 'none';
  if(!code) return;
  if(!relayUrl){
    relayUrl = prompt('Paste your EDITH relay URL (e.g. https://edith.yourname.workers.dev)');
    if(!relayUrl) return;
    relayUrl = relayUrl.trim().replace(/\/$/, '');
  }
  document.getElementById('connectBtn').textContent = 'CONNECTING...';
  try{
    const res = await fetch(relayUrl + '/poll?code=' + encodeURIComponent(code));
    if(!res.ok){
      const errData = await res.json().catch(()=>({}));
      throw new Error(errData.error || ('relay responded ' + res.status));
    }
    // success -- relay + KV binding are working
    document.getElementById('gate').style.display = 'none';
    document.getElementById('display').classList.add('active');
    document.getElementById('dstatus').textContent = 'room ' + code;
    poll();
    pollTimer = setInterval(poll, 1500);
  }catch(err){
    errEl.textContent = 'CONNECTION FAILED: ' + err.message;
    errEl.style.display = 'block';
    document.getElementById('connectBtn').textContent = 'CONNECT';
  }
}

async function poll(){
  try{
    const res = await fetch(relayUrl + '/poll?code=' + encodeURIComponent(code));
    const data = await res.json();
    render(data.messages || [], data.status || 'idle');
  }catch(e){ /* silent -- retry next tick */ }
}

function renderContent(content){
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const parts = content.split(/```(\w*)\n?([\s\S]*?)```/g);
  let html = '';
  for(let i=0;i<parts.length;i+=3){
    html += esc(parts[i] || '');
    if(parts[i+2] !== undefined){
      html += '<pre><code>' + esc(parts[i+2]) + '</code></pre>';
    }
  }
  return html;
}

let lastCount = -1;
function render(messages, status){
  const dial = document.getElementById('ddial');
  dial.classList.toggle('thinking', status === 'thinking');

  if(messages.length === lastCount) return;
  lastCount = messages.length;

  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  messages.forEach(m => {
    const row = document.createElement('div');
    row.className = 'drow ' + m.role;
    const label = m.role === 'user' ? 'YOU' : 'EDITH';
    row.innerHTML = '<div class="meta">' + label + '</div><div class="bubble">' + renderContent(m.content) + '</div>';
    feed.appendChild(row);
  });
  feed.scrollTop = feed.scrollHeight;
}
</script>
</body>
</html>
